name: Docker validation

# Validate Docker support on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-build:
    name: Dockerfile and image build
    runs-on: [self-hosted, linux, ubuntu, docker, shell, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up isolated Docker configuration
        run: |
          set -eu
          config_dir="${RUNNER_TEMP}/docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$config_dir"
          printf 'DOCKER_CONFIG=%s\n' "$config_dir" >> "$GITHUB_ENV"

      - name: Verify Dockerfile exists
        run: |
          set -eu
          if [ ! -f Dockerfile ]; then
            echo "The root Dockerfile is required. Restore it before merging."
            exit 1
          fi

      - name: Build Docker image
        run: docker build --tag "s13-training-camps:check-${GITHUB_SHA}" .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          username: empire20
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          set -eu
          docker tag "s13-training-camps:check-${GITHUB_SHA}" "empire20/s13-training-camps:${GITHUB_SHA}"
          docker tag "s13-training-camps:check-${GITHUB_SHA}" empire20/s13-training-camps:latest
          docker push "empire20/s13-training-camps:${GITHUB_SHA}"
          docker push empire20/s13-training-camps:latest
